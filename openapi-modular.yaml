  /core/systemstatus:
    $ref: './api/core/paths.json#/paths/~1core~1systemstatus'
  
  # Authentication endpoints
  /v2/authentication/me:
    $ref: './api/authentication/paths.json#/paths/~1v2~1authentication~1me'
  /authentication/ticket:
    $ref: './api/authentication/paths.json#/paths/~1authentication~1ticket'
  
  # Add other endpoints similarly...

components:
  schemas:
    $ref: './api/components/schemas/schemas.json'
  securitySchemes:
