      description: "This API generates a link to a blank form that is overlaid onto a specified PDF or image. The fillable fields from the form are embedded into the newly created PDF.<br><br> Note that the fields will always appear on the Last page of the background document.<br><br> Path parameters include the Form ID (appears next to the name of the form in the forms list screen) with the data fields.<br><br>Body Param includes the following form-data fields: <br>•\tstreamProviderId – The identifier of the receiving customer by their phone number or email. (file type: text)<br>•\tstreamProviderType – The type of the streamProviderId:  4 for email, 5 for phone number. (file type: text)<br>•\treferringObjectId (optional) – When the form link is opened, a new form object is created in the system. This object can be linked to another object, for example the initiating conversation, to give the agent an indicator of the filled form. Enter the related conversation ID here. (file type: text)<br>•\tIn the value column, upload the file of the background form. (file type: file)<br>"
      operationId: Create_Predefined_Form_Link
