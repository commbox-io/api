    # About CommBox
    ## Overview
    CommBox redefines the way businesses interact with their customers by providing seamless interactions between different communication modalities, deep integration with customer relations management platforms, and innovative business solutions to improve agents' productivity and service abilities, all while saving time by reducing manual efforts via our automation.

    This document provides the information needed for developers to use CommBox's resources, whether server-based or client-side.

    The CommBox Developers platform lets you access CommBox data and functionality using code instead of the user interface.<br><br> 
    For example, you can use the platform to:
    * Create a new agent and assign that agent to a specific team.
    * Create a WhatsApp template. 
    * Send follow-up SMS/text reminders. 
    * Receive Webhooks based on pre-set triggers in CommBox.<br><br>

     ## CommBox Omnichannel Structure

    <img src="https://www.CommBox.io/wp-content/uploads/2025/04/CommBox-Structure.png">
    # Security and Authentication
    ## Overview
    The CommBox REST API is served over HTTPS, and unencrypted HTTP is not supported to ensure data privacy.<br>In addition, all requests are required to pass Bearer Token (BearerAuth) for authentication, where the token is predetermined and provided by CommBox.

    All requests are logged and validated. 

    All parameters **must** be URL-encoded.

    * **Security Scheme Type**:  HTTPS

    * **HTTP Authorization Scheme**:  bearer

    ## Obtaining an API Key / Access Token

    **Note**: **Admin** privileges are required in order to obtain the **Access Token / API Key**.

    **A Bearer Token must be set in the Authorization header of every API call.**

    In the CommBox console, navigate to **Settings** > **API** (in the Settings & Features section): 
    1. Click the **View** icon next to the API Key.
    2. Click the **Copy** icon on the right.
    3. At the request Authorization tab, select Bearer Token from the Type dropdown list.
    4. At the Token field, paste your Access Token / API Key value. 

    **Warning**: API tokens can pose a security risk to your organization if used by an unauthorized person. Make sure to keep them secure. Delete old keys and replace them in your system if you suspect any security breach.

    ## Replacing/Rotating API Tokens

    API Keys rotate automatically in a pre-set schedule. To reset that schedule or obtain a new key, follow the steps below:<br>

    1. Navigate to **Settings** > **API**.
    2. Click the **Revoke** icon at the far right of the existing API Key.
       A new dialog box will inform you have a 30-day grace period to replace the old key with the new one. Click the **Revoke Key** button.
    3. At the new dialog box, determine how long the new key will be active. You may copy it to other locations from there or do so later within your 30-day grace period.
    4. Finish the process by clicking **Done**.<br> The New API key is displayed above the old one. After 30 days, the old API key will expire.
    5. You may delete the **Revoked/Expired** key by clicking the Trash Bin icon.<br><br>
    <img src="https://www.CommBox.io/wp-content/uploads/2025/04/revoke-API-Key.png">




    ## Obtaining a STREAM ID
    A **STREAM ID** is required for every communication channel (Chat, WhatsApp, etc.).  
     If you don't know the Stream ID, substitute it with the encrypted version (called StreamProviderId):  
    1. At the CommBox console, navigate to **Settings** and select the communication channel.
    2. Click on the communication channel of your choice from the listed channels. The ID number issued by CommBox is right underneath the channel name. 
    3. Place this code wherever you see the **{STREAM_ID}** section of the API. 

       Example:
     
        https://api.CommBox.io/streams/{STREAM_ID}/objects 
        
        https://api.CommBox.io/streams/hNyRN_fLUy7rrOrN9jLpipA%3d%3d/objects
     


     <img src="https://www.CommBox.io/wp-content/uploads/2025/04/Stream-Id-encrypted.png">
     
     # Authentication Modules
    CommBox offers several options for authentication and silent login into our systems in addition to our standard user/password login process.
    ## Directory Services
    We allow a login for our management site using Directory Services (DS) providers (such as Active Directory).

    To set it up, the **Single Sign-On module** must be active, and the domain, username, and password (optional) must be set in the Module Settings tab. Furthermore, every user who wishes to log in using Directory Services must also set the Username field on the Users Management page.

    Once configured, the system will try to validate the username and password fields inputted on the login page against the DS server. If successful, the user will be automatically signed into the system. Otherwise, the system will try to validate the user/password field using the standard CommBox credentials.
    ## Ticket Authentication
    Our authentication system allows users to log in to the management site and chat application using a custom-signed ticket. This ticket is generated through our  <a href="api/#tag/Authentication" title="title">Ticket API</a> by providing the necessary query parameters. Upon successful request, the API returns a session cookie (ticket) that can be appended to the login URL or Chat login URL to facilitate authentication.<br><br>**Note:**<br> To log in to our management site, the ticket must include the business account name (brand), an active username (of an agent), and a strong identifier (email or phone number).<br><br>To log in to our app as a customer, tickets must include the business account name (brand), the channel code, and all the body parameters needed for that specific app. (FirstName, LastName, Phone, email address, etc.)
      
    # CommBox REST APIs
    ## Overview
    CommBox utilizes the REST APIs principles, allowing developers to perform queries to the CommBox platform. We support GET, POST, and DELETE requests.
    Use a **Get** request to retrieve information, a **POST** to create or update an entity, and a **DELETE** to remove an entity.   
    After receiving the request, the API sends back an HTTP code as a response in JSON format.



    ## Structure and Examples
    ### Access Token 
    All API requests require an Access Token to validate authenticity to indicate to the system what modules, operations, and resources the user can access. See more detailed information in the Security and Authentication section of this documentation.

    ### Base URI 
    All URLs referenced in the documentation have the following base: [https://api.CommBox.io](https://api.CommBox.io)


    ### Request

    * The request must include the **module** and **operation** in the URI.<br>
    For example, to access an operation called **SystemStatus** in the **Core** module, make an HTTP request to –
    <br><span style="background-color: #f1f1f1">/Core/SystemStatus</span><br><br>

    * To receive specific information regarding a resource, use the provided parameters in the URI. <br>
    For example, to access a specific user data in the Core module, make an HTTP GET request to –
    <br><span style="background-color: #f1f1f1">/Users/{USER_ID}/Details</span><br><br>

    * To change a resource, use an HTTP POST request to the resource URI.<br>
    For example, to change a specific user name in the Core module, make an HTTP POST request to –
    <br><span style="background-color: #f1f1f1">POST /Users/{USER_ID}/Details</span><br> 
    And include the post parameter
    <br><span style="background-color: #f1f1f1">data={\"FirstName\":\"FIRSTNAME\", \"LastName\":\"LASTNAME\"}
    </span><br><br>

    * To delete a resource, use an HTTP DELETE request to the resource URI.<br>
    For example, to change a specific user name in the Core module, make an HTTP DELETE request to –
    <br><span style="background-color: #f1f1f1">DELETE  /Users/{USER_ID}/</span><br><br>


    ### Response

    Property  | Description
    ------------- | -------------
    status  | The HTTP status code for the response
    description  | A more informative message
    response_time | UTC Timestamp for the operation
    data | (Optional) Additional output data, varies by operation

    <br>

    ### Possible Response Status Codes

    Status Code  | Description | Notes
    ------------- | ------------- | -
    200  | OK | The request was successful
    400  | Bad Request | The request could not be understood by the server. Incoming parameters might not be valid
    401 | Unauthorized | The supplied credentials, if any, are not sufficient to access the resource
    404 | Not Found | The requested resource is not found
    429  | Too Many Requests | Too many requests have been made in a short period of time (Throttling)
    500 | Server Error | The server could not return the representation due to an internal server error
    501 | Not Implemented | The requested operation is not supported (e.g. supports GET but not POST etc.)

    ### API Calls Examples
    Our various API can be found under the <a href="/api#tag/Core" title="title">"API Calls Section"</a>  

    # Webhooks
    ## Overview
    A webhook sends an HTTP POST request to a specified URL responding to a trigger (an “event”) in CommBox.
    For example, every time a new user is created or deleted, CommBox will send a notification to the callback URL provided by the client. The webhook system of notification and updates eliminates continuous or periodic requests when changes haven't occurred.

    **Note:** We strongly recommend using an HTTPS callback URL with a strong encrypted certificate.

    To register for this service, contact your CommBox CS. 

    ## Webhook Structure 
    All updates contain a wrapper called “Event,” which indicates the subscription source and name of the trigger event. Inside the wrapper will be the actual data relevant to this update.

    **Note:** Notifications can be transferred as XML objects. 

     ### Xml Example
     For a new object that was received on CommBox's servers, an “OnNew” event will be triggered and posted to the client callback URL:
     
        <Event Subscription="Object" Name="OnNew">
          <Object Id="123456" StreamId="1" SubStreamId="1" Type="0" StatusID="1" CreateDate="2024-09-23 12:39:11">
          <Message>New status from facebook, Hello world!</Message>
          <Content>{"num_likes":5,"user_likes":false,"num_shares":2}</Content>
            <User Id="123" UniqueID="123" Phone1="972526444555" Phone2="" Email="yuval@gmail.com" FirstName="Yuval"
             LastName="Hakim" Gender="M" NumIdentities="3" Locale="en_US" Birthday="1951-10-10"
             Remarks="User remarks">
              <Identity Id="12345" StreamProviderId="11111111" StreamProviderType="1"
               StreamProviderEmail="yuval@gmail.com" UserName="yuvalh" FirstName="Yuval"
               LastName="Hakim" ThumbnailUrl="//graph.facebook.com/11111111/picture" NumObjects="13">
              </Identity>
            </User>
          </Object>
        </Event>

    ## Object Events Subscriptions
    ### OnNew
    This event is triggered by creating a new object (conversation).<br><br>
    Example:

        <Event Subscription="Object" Name="OnNew" Brand="CommBox">
          <Object Id="123456" StreamId="1" SubStreamId="1" Type="5"
          StatusID="1" CreateDate="2024-09-23 12:39:11"
          StreamProviderId="CAEooBmqRVHRrfRmOcCSzSsYMUHUu5NY+NA@mail.gmail.com" StreamProviderType="Mail">
          <Message>New status from facebook, Hello world!</Message>
          <Content>{"num_likes":5,"user_likes":false,"num_shares":2}</Content>
          <ManagerId>0</ManagerId>
          <Snippet>Hello</Snippet>
            <User Id="123" UniqueID="123" Phone1="972501111111" Phone2=""
            Email="yuval@gmail.com" FirstName="Yuval" LastName="Hakim"
            Gender="M" NumIdentities="3" Locale="en_US" Birthday="1951-10
            10" Remarks="User remarks" NumObjects="13">
            <Content>{}</Content>
              <Identity Id="12345" StreamProviderId="11111111"
              StreamProviderType="1"
              StreamProviderEmail="yuval@gmail.com"
              UserName="yuvalh" FirstName="Yuval" LastName="Hakim"
              ThumbnailUrl="//graph.facebook.com/11111111/picture">
              </Identity>
            </User>
          </Object>
        </Event>

    ### OnNewChild
    This event is triggered by creating a new child object (message in a conversation).<br><br>
    Example:

        <Event Subscription="Object" Name="OnNewChild" Brand="CommBox">
          <Object Id="901730" StreamId="71" SubStreamId="0">
            <Children>
              <Child Id="2099753" CreateDate="26-03-2017 06:36:15" 
              Type="0" StreamProviderId="CAEooBmqRVHRrfRm5NY+NA@mail.gmail.com" StreamProviderType="Mail">
              <Message>Hello</Message>
              <ManagerId>0</ManagerId>
              <Content>{"sessionId":133}</Content>
              <Snippet>Hello</Snippet>
                <User Id="1798715" Phone1="97243434343" Phone2="" 
                UniqueID="" Email="" FirstName="michael" 
                LastName="kantz" NumIdentities="1" Locale=""
                Remarks="" NumObjects="1">
                <Content>{}</Content>
                  <Identity Id="2191863" 
                  StreamProviderId="43434343"
                  StreamProviderType="5" 
                  StreamProviderEmail="michael.k@gmail.com" 
                  UserName="" FirstName="michael"
                  LastName="kantz" 
                  ThumbnailUrl="//graph.facebook.com/146582153
                  /picture"/>
                </User>
              </Child>
            </Children>
          </Object>
        </Event>

    ### OnNewActivity
    The following events can be triggered by the creation of a new activity:<br><br>
    <b>(a) New remark activity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901738" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565533" Type="1" CreateDate="27-03-2017 06:29:59">
                <User Id="433178">
                <Identity Id="16982" />
                </User>
                <Data>{"text":"New remark"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>
        
    <b>(b) Status change activity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901731" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565420" Type="2" 
              CreateDate="26-03-2017 06:57:33">
              <User Id="433178">
              <Identity Id="16982" />
              </User>
              <Data>{"statusId": 8}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>
        
    <b>(c) Object forward activity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901738" StreamId="71" SubStreamId="0">
          <Activities>
            <Activity Id="565534" Type="3" CreateDate="27-03-2017 06:29:59">
              <User Id="433178">
              <Identity Id="16982" />
              </User>
              <Data>{"message":"forward object","recipients":["john.k@gmail.com"],
              "allowEmailReply":true,"allowCustomerDetails":true}
              </Data>
              </Activity>
            </Activities>
            </Object>
        </Event>

    <b>(d) Reply to forwarded object activity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901738" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565532" Type="4" CreateDate="27-03-2017 
              06:29:59">
              <User Id="123" />
              <Data>{"message":"test
              test","recipients":["john.k@gmail.com"],
              "attachments":"{}"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event> 

    <b>(e) Object stream change</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901738" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565533" Type="5" CreateDate="27-03-2017 
              06:29:59">
              <User Id="123" />
              <Data>{"oldObjectSubstreamName":"old_stream_name","oldObjectStreamName":"old_sub_stream_name",
              "newObjectStreamName":"new_stream_name", "newObjectSubstreamName":"new_sub_stream_name"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event> 

    <b>(f) New manager assignment</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="6" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"managerId":4342094,"assignedManagerId":4342094}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(g) Update object tag</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="7" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"tagId":11,"objectId":4342094,"isRemoveTag":false,"name":"tag1","group_name":"group1"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(h) Follow up object activity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="8" CreateDate="26-03-2017 
              08:45:50">
              <User Id="433178">
              <Identity Id="16982" />
              </User>
              <Data>{"text": "test follow up" ,
              "scheduledTime": "03/28/2017 05:30:00"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(i) Update object intent</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="9" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"intentIds":[11],"objectId":4342094,"isRemoveIntent":false,"names":["tag1"]}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(j) Update object attachments</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="10" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"objectId":4342094,"managerId":452224,
              "attachments":{"attachments":[{"href":"/media/Brands/test//5-17/test_image.png","name":"test_image"}]},
              "attachmentType":"videoCapture"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(k) Object routed</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="11" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"originalStreamId":12222,"destStreamId":114444,"destSubStreamId":11,"changedStatusId":4,
              "tagId":353,"tagName":"plus_tag"}}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(l) Update object publicity</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="13" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"changePublicityToPublic":false}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(m) Unvalid extension file</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="15" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"fileName":"3c3b71_IMG_1988.jpeg","status":"failed",
              "description":"Unsupported file type: image/heic extension: jpeg","unValidActivity":15,
              "fileExtension":"jpeg"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(n) Unvalid file size</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="16" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"status":"failed","description":"File is too big","maxFileSizeAllow": 10,
              "unValidActivity":16}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(o) Unallowed file upload</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="17" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"status":"failed","description":"media dos not enabled","unValidActivity":17}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(p) Inactivity logout</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="18" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>

    <b>(q) Participants change</b><br>
    Example:

        <Event Subscription="Object" Name="OnNewActivity" Brand="CommBox">
          <Object Id="901733" StreamId="71" SubStreamId="0">
            <Activities>
              <Activity Id="565443" Type="19" CreateDate="26-03-2017 
              08:45:50">
              <User Id="4342094">
              <Identity Id="16982" />
              </User>
              <Data>{"action":"addParticipant","performingAgentId":192229,"isAgent":true,
              "addedParticipantName":"tomer_b"}</Data>
              </Activity>
            </Activities>
          </Object>
        </Event>
        
    ### OnUpdateTag
    These events are triggered by an update of a tag relating to the object (conversation tag):<br><br>
    <b>(a) Add</b><br>
        Example:

        <Event Subscription="Object" Name="OnUpdateTag" Brand="CommBox">
          <Object Id="901731" StreamId="71" SubStreamId="0">
            <Tags>
            <Tag Id="1608" Action="Add" />
            </Tags>
          </Object>
        </Event>
    <b>(b) Remove</b><br>
    Example:

        <Event Subscription="Object" Name="OnUpdateTag" Brand="CommBox">
          <Object Id="901731" StreamId="71" SubStreamId="0">
            <Tags>
            <Tag Id="1611" Action="Remove" />
            </Tags>
          </Object>
        </Event>




    ## User Events Subscriptions
    Events in this section indicate a change that occurred in CommBox monitored user(s). The change may be the creation of a new user or an update of an existing one. All updates must contain the surrounding “Event” property and a “User” property and may contain additional properties. 


    ### OnNew
    This event is triggered by the creation of a new user.<br><br>
    Example:

        <Event Subscription="User" Name="OnNew" Brand="CommBox">
          <User Id="1798714" Phone1="97252570000" Phone2="" UniqueID="" Email="john.doe@gmail.com"
           FirstName="michaeli" LastName="" NumIdentities="1" Locale="en_US" Remarks="" NumObjects="0">
          <Content>{}</Content>
          <Identity Id="2191862" StreamProviderId="kantzmichaeli@gmail.com" StreamProviderType="4"
           StreamProviderEmail="" UserName="michaelk" FirstName="michaeli" LastName="kantz" ThumbnailUrl="" />
          </User>
        </Event>

    ### OnUpdate
    This event is triggered by an update of a user.<br><br>
    Example:

        <Event Subscription="User" Name="OnUpdate" Brand="CommBox">
          <User Id="1710055" Phone1="97252570000" Phone2="972525757054" UniqueID="206064"
           Email="kantzmichael@gmail.com" FirstName="michael" LastName="kantz" Gender="M" NumIdentities="1"
           Locale="" Remarks="New user details">
          <Content>{}</Content>
          </User />
        </Event>

    ### OnUpdateTag
    This event is triggered by an update of a tag relating to the user.<br><br>
    Example:

        <Event Subscription="User" Name="OnUpdateTag" Brand="CommBox">
          <User Id="1798718" Phone1="972525757054" Phone2="972525757054" 
          UniqueID="" Email="michael.k@gmail.com" FirstName="michael" 
          LastName="" NumIdentities="1" Locale="" Remarks="" 
          Content="{}">
            <Tags>
            <Tag Id="1073" Action="Add" />
            </Tags>
          </User>
        </Event>

    ## Satisfaction Events Subscriptions
    This section contains events that describe customer satisfaction reports. Updates must contain a surrounding “Event” property and a “Satisfaction” property. 

    ### OnSubmit
    This event is triggered by a submission of a satisfaction report relating to some object (conversation).<br><br>
    Example:

        <Event Subscription="Satisfaction" Name="OnSubmit" Brand="CommBox">
          <Satisfaction ObjectId="901733">
          <Score>100</Score>
          <Description>excellent</Description>
          </Satisfaction>
        </Event>

    ## Form Events Subscriptions
    This section contains events that occurred when a form is created or changed. Updates must contain a surrounding “Event” property and a “Form” property. 

    ### OnSubmit
    This event is triggered when a customer submits a form, and the form PDF file is saved on the disk.<br><br>
    Example:

        <Event Subscription="Form" Name="OnSubmit" Brand="CommBox">
          <Form
          <ObjectId>901733</ObjectId>
          <FormUrl> https://apps.CommBoxdev.io/form...</FormUrl>
          <Properties>{“field_0”:”Jhon”,”my_own_param”:”1234”}</Properties>
          </Form>
        </Event>

    ## Chat Events Subscriptions
    This section contains events that occurred when the user closes the chat window or disconnects.

    ### OnUserExit
    This event is triggered when the user closes the chat window or disconnect.<br><br>
    Example:

        <Event Subscription="Chat" Name="OnUserExit" Brand="CommBox">
          <Chat>
            <User id="901733"></User>
            <Object id="901735"></Object>
          </Chat>
        </Event>

    # Customization

    We provide customization of our functionalities to be tailored to the client's needs.<br><br> 

    ## An iFrame on 3rd party Assets 
    We enable our site to be embedded on other web-based platforms as an iFrame. Such integrations enable agents to work within the CRM or Contact platforms and utilize CommBox for communication with customers. Data records are created and updated seamlessly between the two platforms.<br><br>  
    <img src="https://www.CommBox.io/wp-content/uploads/2025/04/SAP-iFrame.png">
     

    Available CRM integrations include **Salesforce**, **Microsoft Dynamics**, **SAP C4C** and more. <br><br>

    ## Widgets
    We provide several premade widgets for embedding our Inbox or Object (conversation) in your Dashboards or CRM. These widgets isolate the Object from the rest of the platform, allowing CommBox clients to incorporate them into their 3rd party system.<br><br>
      To only view the dialog box of the CommBox platform, use this URL:<br>
      [https://manange.CommBox.io](https://manange.CommBox.io)<br>
      To only view a specific Object (conversation), use this URL with the Conversation Id:<br>
      [https://manange.CommBox.io/widget/object/{Object_Id}](https://manange.CommBox.io/widget/object/{Object_Id})<br> 
    To obtain the Object Id, click on the 3-vertical-dots menu at the top left corner of the main pane. The Id is displayed at the bottom of that window. <br><br>  

    ## Desktop Management Customization
    CommBox allows CSS customization for most page elements and specific JavaScript code elements for client-side events. Contact us for more information.<br><br>

    # Data structures 
    This section outlines the data structures recognized and transmitted by the API.

    **Objects** represent conversations between bots or agents and customers. Each segment within a conversation is referred to as a **Child**. Every conversation is associated with a designated **Stream** — a communication channel such as chat, email, SMS, etc. — where the interaction takes place.

    In the **Objects** category, the focus is on a specific conversation, with the stream serving as part of its identifying attributes. Conversely, in the **Streams** category, the communication channel itself is the primary focus, while objects and users act as filtering criteria for the request.

    ## Object
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | Object ID. A CommBox generated number for the conversation.| 
    StreamId  | int64 | Stream ID to which the object is connected | 
    SubStreamId | int64 | Sub Stream ID to which the object is connected |  
    Type | short | The type of the object | <a href="/api#section/Enums/ObjectType" title="title">Object Types</a>
    StatusId | string | Current status ID| <a href="/api#section/Enums/ObjectStatusType" title="title">ObjectStatusType</a>
    CreatedTime| datetime | When the object was created | In UTC time
    FirstResponseTime | datetime | When the first response to the object was registered | In UTC time
    UpdatedTime  | datetime | When the object was last updated | In UTC time
    PriorityTime  | datetime | When the object is currently prioritized | In UTC time
    NumChilds | int | Number of child objects relating to this parent object |  
    IsManager | bool | Indicates whether this object was created by an agent |
    NumTags | int | Number of tags assigned to this object|
    Message| string | The text containing the object's primary message |
    Content | JSON string | String containing extended properties of the object |
    User | object | The user that created the object| <a href="/api/#section/Data-structures/User" title="title">User</a>

    ## Object Child
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | Child ID. A CommBox generated number for the message |
    Type | short | The type of the child | <a href="/api#section/Enums/ObjectType" title="title">Object Types</a>
    IsManager | bool | Indicates whether this child was created by an agent |
    CreatedTime| datetime | When the child was created | In UTC time
    Message| string | The text containing the child's primary message |
    Content | JSON string | String containing extended properties of the child |
    User | object | The user that created the child| <a href="/api#section/Data-structures/User" title="title">User</a>

    ## ObjectActivityLog
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Text  | string | Text content in the activity log |
    Source | string | The source of the activity log (optional) | 
    ManagerId | Int64 | The manager who initialize the activity log (optional) |

    ## Tag
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | Tag ID. This is a CommBox generated number |

     ## User
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | User ID. A CommBox generated number for the agent/customer etc.|
    UniqueId | string(50) | User's unique identifier. This can be an email, social security number or any other type of unique string determined by the brand administrators |
    Phone1 | Numeric string(20) | User's phone number | Always contains country code and without leading + or 00
    Phone2| Numeric string(20) | User's additional phone number | Always contains country code and without leading + or 00
    Email | string (255) | User's email address |
    FirstName | string (100) | User's first name |
    LastName | string (100) | User's last name |
    Gender | string (1) | User's gender | ‘M' for male, ‘F' for female
    Locale | object | User's locale |
    Birthday | date | User's birthday | Date only
    NumIdentities | int | Number of active identities that are connected to this user |
    IsManager | bool |  Indicates whether this user is a agent or an admin (true) or a
            customer (false) |

    Remarks | string | Free text containing general remarks about the user | 
    Identity | object | Identity object that is connected to the user | <a href="/api/#section/Data-structures/User-Identity" title="title">User Identity</a>

    ## User Identity
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | Identity ID. This is a CommBox generated number and used throughout all the updates |
    StreamProviderId | string(255) | Identity's unique identifier as it appears at the original provider |
    StreamProviderType | int64 | Type of the original provider | <a href="/api/#section/Enums/StreamProviderType" title="title">StreamProviderType</a>
    StreamProviderEmail| string(255) | Identity's email as it appears at the original provider |
    UserName | string (100) | Identity's user name as it appears at the original provider |
    FirstName | string (100) | Identity's first name as it appears at the original provider |
    LastName | string (100) | Identity's last name as it appears at the original provider |
    ThumbnailUrl | string (255) | Link to the identity's profile image |
    NumObjects | int | Number of objects connected to this identity |

    ## Manager
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    Id  | int64 | Manager ID. This is a CommBox generated number and used throughout all the updates |
    AsyncAssignedNoResponse | int | Current number of assigned asynchronous objects awaiting response |
    AsyncAssignedInProccess | int | Current number of assigned asynchronous objects that are being addressed by the manager |
    SyncAssignedNoResponse| int | Current number of assigned synchronous objects awaiting response (Chat/messenger conversations) |
    SyncAssignedInProccess | int | Current number of assigned synchronous objects that are being addressed by the manager (Chat/messenger conversations) |
    FaceToFaceStatus | bool | Returns true if the manager is busy with a face to face object (Voice/Video call) |
    TotalAsyncAssigned | int | Total number of currently assigned objects |
    TotalSyncAssigned | int | Total number of currently assigned synchronous objects (Chat/messenger conversations) |

    ## Object custom indicator
    Property  | Value | Description | Notes
    ------------- | ------------- | - | -
    IndicatorId  | string | Indicator id (unique name) – to allow updating/ deleting existing indicator |
    DisplayClass | string | Indicator class. Mandatory only if Icon has not provided | You must provide DisplayClass or an Icon, or both
    Icon | string | An icon for the indicator. Supports URL. Mandatory only if Icon has not provided (not relevant for DELETE operation) |
    Title| string | A title for the indicator (not relevant for DELETE operation) |

