  /streams/{STREAM_ID}/objects/{OBJECT_ID}/child:
    post:
      tags:
        - Objects
      summary: Create Child Object
      description: ' This API creates a message (child) in a conversation (object) on behalf of the agent, sending it to the customer, or on behalf of the customer, displaying it to the agent.<br> The API returns the new child''s ID.<br><br>Required path parameters include the Stream (channel) ID and the Object (conversation) ID.<br><br>Required body parameters for a message on behalf of the customer:<br> a) The data “Type” see Enum at https://www.CommBox.io/api/#section/Enums/ObjectType <br> b) UserStreamProviderId – the email or phone number of the person you are sending the message on their behalf.<br> c) UserStreamProviderType of the channel. See Enum at https://www.CommBox.io/api/#section/Enums/StreamProviderType <br> d) The messages<br><br>Required body parameters for a message on behalf of the agent:<br> a) The data “Type” - See Enum at https://www.CommBox.io/api/#section/Enums/ObjectType <br> b) Add this Boolean field ''IsManager'': true,<br> c) Enter the agent''s user ID ''UserIdentity'' : 34168, <br> Get the agent''s User ID by using the Get Managers API https://api.CommBox.io/managers <br> d) UserStreamProviderId – the email or phone number of the person you are sending the message on their behalf. <br> e) UserStreamProviderType of the channel. See Enum at https://www.CommBox.io/api/#section/Enums/StreamProviderType <br> f) The messages <br><br>**Note:** After 24 hours from last sent message, APIs messages sent to customers will be blocked by WhatsApp.<br><br>POST /streams/STREAM_ID/objects/OBJECT_ID/child<br>POST /streams/STREAM_ID/objects/STREAM_PROVIDER_ID/STREAM_PROVIDER_TYPE/child'
      operationId: Create_Child_Object
      parameters:
        - name: STREAM_ID
          in: path
          description: The unique identifier for the stream (CommBox channel)
          required: true
          schema:
            $ref: '#/components/parameters/STREAM_ID/schema'
        - name: OBJECT_ID
          in: path
          description: The unique identifier for the object (CommBox conversation)
          required: true
          schema:
            $ref: '#/components/parameters/OBJECT_ID/schema'
      requestBody:
        description: Payload containing child object information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_Child'
            examples:
              On behalf of Agent - Sending an email:
                value:
                  data:
                    IsManager: true
                    UserIdentity: 36574658
                    Type: 4
                    UserStreamProviderId: best.agent@CommBox.com
                    UserStreamProviderType: 4
                    Message: A new message on behalf of the agent
              On behalf of Agent - Sending a WhatsApp message:
                value:
                  data:
                    IsManager: true
                    UserIdentity: 36574658
                    Type: 4
                    UserStreamProviderId: '972542660000'
                    UserStreamProviderType: 7
                    Message: A new message on behalf of the agent
              On behalf of Customer:
                value:
                  data:
                    Type: 4
                    UserStreamProviderId: MrDoe@gmail.com
                    UserStreamProviderType: 4
                    Message: A message on behalf of Mr. John Doe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 200
                  description:
                    type: string
                    example: OK
                  response_time:
                    type: string
                    example: '2025-07-27T15:28:43.096637Z'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 294159
        '400':
          description: Bad Request - The request could not be understood by the server. Incoming parameters might not be valid
        '401':
          description: Unauthorized - The supplied credentials, if any, are not sufficient to access the resource
        '404':
          description: Not found - The requested resource is not found
        '429':
          description: Too Many Requests - Too many requests have been made in a short period of time (Throttling)
        '500':
          description: Server Error - The server could not return the representation due to an internal server error
        '501':
          description: Not Implemented - The requested operation is not supported
