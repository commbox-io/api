      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                streamProviderId:
                  format: text
                  description: The identifier of the receiving customer by their phone number or email
                  example: '19175552345'
                streamProviderType:
                  format: text
                  description: 4 for email, 5 for phone number
